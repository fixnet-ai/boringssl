name: Build BoringSSL

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0)"
        required: false
        default: ""

env:
  BORINGSSL_REPO: https://github.com/google/boringssl.git
  BORINGSSL_COMMIT: 1a5078d343ba5d9501062caf11e3173fc364dc59
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            zig-target: aarch64-macos-none
            cmake-system: Darwin
            cmake-processor: aarch64
          - target: linux-aarch64
            zig-target: aarch64-linux-musl
            cmake-system: Linux
            cmake-processor: aarch64
          - target: windows-aarch64
            zig-target: aarch64-windows-gnu
            cmake-system: Windows
            cmake-processor: ARM64

    runs-on: ubuntu-latest

    steps:
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -sSfL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o zig.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-$ZIG_VERSION" >> $GITHUB_PATH

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Clone BoringSSL
        run: |
          git init boringssl
          cd boringssl
          git fetch --depth 1 $BORINGSSL_REPO $BORINGSSL_COMMIT
          git checkout FETCH_HEAD

      - name: Setup cross-compilation tools
        run: |
          # macOS 交叉编译需要 install_name_tool（仅静态库不需要，创建 dummy）
          sudo ln -sf /usr/bin/true /usr/local/bin/install_name_tool 2>/dev/null || true

      - name: Configure
        run: |
          ZIG="$(which zig)"
          export CC="$ZIG cc -target ${{ matrix.zig-target }}"
          export CXX="$ZIG c++ -target ${{ matrix.zig-target }}"
          export CCAS="$ZIG cc -target ${{ matrix.zig-target }}"
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_SYSTEM_NAME=${{ matrix.cmake-system }} \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake-processor }} \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_INSTALL_NAME_TOOL=/usr/local/bin/install_name_tool \
            -DARCH=aarch64
        working-directory: boringssl

      - name: Build ssl + crypto
        run: cmake --build build --target ssl crypto --config Release
        working-directory: boringssl

      - name: Package artifacts
        run: |
          set -e
          DIST="boringssl-${{ matrix.target }}"
          mkdir -p "$DIST/lib" "$DIST/include"
          cp -R boringssl/include/openssl "$DIST/include/"
          cp boringssl/build/ssl/libssl.a "$DIST/lib/"
          cp boringssl/build/crypto/libcrypto.a "$DIST/lib/"
          tar czf "$DIST.tar.gz" "$DIST"
          echo "ARCHIVE=$DIST.tar.gz" >> $GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: boringssl-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 90

  release:
    name: Create Release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: |
            BoringSSL prebuilt static libraries (zig cc cross-compilation, Zig ${{ env.ZIG_VERSION }}).

            **Source commit:** `${{ env.BORINGSSL_COMMIT }}`

            | Platform | Archive |
            |----------|---------|
            | macOS aarch64 | `boringssl-macos-aarch64.tar.gz` |
            | Linux aarch64 | `boringssl-linux-aarch64.tar.gz` |
            | Windows aarch64 | `boringssl-windows-aarch64.tar.gz` |

            ### Usage

            ```bash
            curl -LO "https://github.com/fixnet-ai/boringssl/releases/download/$VERSION/boringssl-linux-aarch64.tar.gz"
            tar xzf boringssl-linux-aarch64.tar.gz
            # → boringssl-linux-aarch64/{include/openssl/*.h, lib/libssl.a, lib/libcrypto.a}
            ```
          files: artifacts/*/*
          draft: false
          prerelease: false
